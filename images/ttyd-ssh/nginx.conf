worker_processes 1;
pid /tmp/mwc-http-proxy.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/mwc-http-body;
    proxy_temp_path /tmp/mwc-http-cache;
    map_hash_bucket_size 512;

    map $host $mwc_upstream_port {
        default "";
        include /etc/mwc-http-routes/*.conf;
    }
    map $http_upgrade $mwc_connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8443 ssl;
        ssl_certificate /etc/mwc-ttyd-tls/tls.crt;
        ssl_certificate_key /etc/mwc-ttyd-tls/tls.key;
        ssl_client_certificate /etc/mwc-ttyd-tls/ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:mwc_proxy_tls:1m;
        client_max_body_size 0;

        location / {
            if ($mwc_upstream_port = "") {
                return 404;
            }
            proxy_pass http://127.0.0.1:$mwc_upstream_port;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $mwc_connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
