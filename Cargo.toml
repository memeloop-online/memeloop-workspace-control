[package]
name = "memeloop-workspace-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Kubernetes workspace management control plane"
license = "Apache-2.0"

[dependencies]
aes-gcm = "0.11"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
mime_guess = "2.0.5"
futures = "0.3"
hmac = "0.12"
k8s-openapi = { version = "0.28", features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
rust-embed = "8.12.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "json"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "getrandom"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["uuid"] }
uuid = { version = "1", features = ["serde", "v7"] }
url = "2"
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "symbols"
