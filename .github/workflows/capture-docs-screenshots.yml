name: capture-docs-screenshots

on:
  push:
    branches: [docs/real-product-screenshots]
    paths:
      - '.github/workflows/capture-docs-screenshots.yml'
      - 'web/tests/capture-docs-screenshots.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Connect to the private test network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.MWC_DOCS_TAILSCALE_AUTHKEY }}
          args: --login-server=https://headscale.onetwo.website:8080 --accept-routes
          hostname: mwc-docs-${{ github.run_id }}
          use-cache: 'false'

      - name: Install browser runtime
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Capture sanitized product screenshots
        working-directory: web
        env:
          MWC_SCREENSHOT_TOKEN: ${{ secrets.MWC_DOCS_SCREENSHOT_TOKEN }}
          MWC_SCREENSHOT_ORIGIN: https://workspace.k3s.onetwo.website
          MWC_SCREENSHOT_OUTPUT: ../docs-screenshots
        run: node tests/capture-docs-screenshots.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: docs-screenshots
          if-no-files-found: error
          retention-days: 1
