name: TopoLVM volume queue

on:
  pull_request:
    paths:
      - .github/workflows/topolvm-volume-queues.yml
      - images/topolvm-node/Dockerfile
      - images/topolvm-node/volume-workers.patch
      - tests/topolvm-node/measure-publish.sh
      - tests/topolvm-node/measure-queue.sh
      - tests/topolvm-node/queue-timings.py
      - tests/runtime-product-vm/topolvm-values.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/topolvm-volume-queues.yml
      - images/topolvm-node/Dockerfile
      - images/topolvm-node/volume-workers.patch
      - tests/topolvm-node/measure-publish.sh
      - tests/topolvm-node/measure-queue.sh
      - tests/topolvm-node/queue-timings.py
      - tests/runtime-product-vm/topolvm-values.yaml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPOLVM_SHA: 2d0c5174afb93856d9fc5105e7c04ed50b65628f
      TOPOLVM_IMAGE: ghcr.io/memeloop-online/memeloop-workspace-control-topolvm-controller@sha256:78da459df4061ddc7c0c39cd7681233d3d9728599f997f62a33ae1a413afa497
      NODE_BASE_IMAGE: ghcr.io/memeloop-online/memeloop-workspace-control-topolvm-controller@sha256:4d3edf502ca487d75c02bf9f5e55bdb4e1d65eb966987b46a782cf4ed23c360f
      NODE_IMAGE: localhost/topolvm-node-ci:patched
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: topolvm/topolvm
          ref: ${{ env.TOPOLVM_SHA }}
          path: topolvm-source
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: topolvm-source/go.mod
          cache: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare OCI copy and thin storage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo lvm2 thin-provisioning-tools xfsprogs
          sudo modprobe dm_thin_pool
      - name: Build the TopoLVM queue-only node image
        working-directory: topolvm-source
        run: |
          test "$(git rev-parse HEAD)" = "$TOPOLVM_SHA"
          git apply "$GITHUB_WORKSPACE/images/topolvm-node/volume-workers.patch"
          gofmt -w cmd/topolvm-node/app/{root,run}.go {internal,pkg}/controller/logicalvolume_controller.go
          out="$RUNNER_TEMP/queue-image"
          mkdir -p "$out"
          cp "$GITHUB_WORKSPACE/images/topolvm-node/Dockerfile" "$out/"
          CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags '-w -s -X github.com/topolvm/topolvm.Version=0.41.1-mwc-volume-workers' \
            -o "$out/topolvm-node" ./cmd/topolvm-node
          docker buildx build --platform linux/amd64 --provenance=false \
            --build-arg "BASE_IMAGE=$NODE_BASE_IMAGE" \
            --output "type=oci,dest=$out/topolvm-node.oci.tar,compression=gzip,force-compression=false" "$out"
          archive="$out/topolvm-node.oci.tar"
          digest=$(tar -xOf "$archive" index.json | jq -er '[.manifests[]] | select(length==1) | .[0].digest')
          tar -xOf "$archive" "blobs/sha256/${digest#sha256:}" > "$out/manifest.json"
          test "$digest" = "sha256:$(sha256sum "$out/manifest.json" | cut -d' ' -f1)"
          echo "$digest" > "$out/manifest-digest.txt"
          jq -er '.config.digest' "$out/manifest.json" > "$out/config-digest.txt"
          skopeo inspect --raw "docker://$NODE_BASE_IMAGE" > "$out/base.json"
          if jq -e 'has("manifests")' "$out/base.json" >/dev/null; then
            base=$(jq -er '[.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64")] | select(length==1) | .[0].digest' "$out/base.json")
            skopeo inspect --raw "docker://${NODE_BASE_IMAGE%@*}@$base" > "$out/base.json"
          fi
          jq -e --slurpfile base "$out/base.json" '
            ($base[0].layers | length) as $n
            | select((.layers | length) == $n+1)
            | select([.layers[:$n][].digest] == [$base[0].layers[].digest])
            | {reused_layers:$n, new_layer_bytes:.layers[-1].size, new_layer:.layers[-1].digest}
          ' "$out/manifest.json" | tee "$out/layer-reuse.json"
          skopeo copy "oci-archive:$archive" "docker-daemon:$NODE_IMAGE"
          test "$(docker image inspect "$NODE_IMAGE" --format '{{.Id}}')" = "$(cat "$out/config-digest.txt")"
          docker run --rm --entrypoint /bin/sh "$NODE_IMAGE" -ec 'test -x /topolvm-node && test ! -L /topolvm-node'
          docker run --rm --entrypoint /topolvm-node "$NODE_IMAGE" --version |
            grep -Fx 'topolvm-node version 0.41.1-mwc-volume-workers'
          binaries() {
            docker run --rm --entrypoint /bin/sh "$1" -ec \
              'sha256sum /hypertopolvm /topolvm-controller /topolvm-scheduler /lvmd /csi-provisioner /csi-node-driver-registrar /csi-resizer /csi-snapshotter /livenessprobe'
          }
          docker pull "$NODE_BASE_IMAGE"
          binaries "$NODE_BASE_IMAGE" > "$out/base-binaries.txt"
          binaries "$NODE_IMAGE" > "$out/overlay-binaries.txt"
          diff -u "$out/base-binaries.txt" "$out/overlay-binaries.txt"
      - name: Prepare public images for the native run
        run: |
          docker pull "$TOPOLVM_IMAGE"
          bash -n tests/topolvm-node/measure-publish.sh
          bash -n tests/topolvm-node/measure-queue.sh
          alpine=docker.io/library/alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          docker pull "$alpine"
          docker tag "$TOPOLVM_IMAGE" localhost/topolvm-queue-ci:controller
          docker save -o "$RUNNER_TEMP/topolvm-node-images.tar" \
            "$NODE_IMAGE" localhost/topolvm-queue-ci:controller "$alpine"
      - name: Compare real K3s and XFS volumes
        run: |
          proof="$RUNNER_TEMP/topolvm-queue"
          status=0
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT unshare --mount --propagation private \
            bash tests/topolvm-node/measure-publish.sh "$proof" queue || status=$?
          sudo chown -R "$(id -u):$(id -g)" "$proof/evidence"
          cp "$RUNNER_TEMP/queue-image/layer-reuse.json" "$proof/evidence/"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: topolvm-volume-queues-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/topolvm-queue/evidence
          if-no-files-found: ignore
      - name: Preserve the tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          out="$RUNNER_TEMP/tested"
          mkdir -p "$out"
          tested="$RUNNER_TEMP/queue-image"
          test "$(docker image inspect "$NODE_IMAGE" --format '{{.Id}}')" = "$(cat "$tested/config-digest.txt")"
          mv "$tested/topolvm-node.oci.tar" "$tested/manifest-digest.txt" "$out/"
          (cd "$out" && sha256sum manifest-digest.txt topolvm-node.oci.tar > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-topolvm-volume-queue-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: compare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-topolvm-node
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-topolvm-volume-queue-${{ github.sha }}-${{ github.run_attempt }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the OCI copy utility
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Publish the exact image tested on thin pools
        id: push
        run: |
          sha256sum -c SHA256SUMS
          digest=$(cat manifest-digest.txt)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          tag="$IMAGE:queue-sha-$GITHUB_SHA"
          skopeo copy --preserve-digests --dest-authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
            oci-archive:topolvm-node.oci.tar "docker://$tag"
          published=$(skopeo inspect --raw "docker://$tag" | sha256sum | cut -d' ' -f1)
          test "sha256:$published" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
