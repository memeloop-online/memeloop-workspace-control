name: TopoLVM volume queue experiment

on:
  pull_request:
    paths:
      - .github/workflows/topolvm-volume-queues.yml
      - tests/topolvm-node/measure-publish.sh
      - tests/topolvm-node/measure-queue.sh
      - tests/topolvm-node/queue-*.*
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TOPOLVM_SHA: 2d0c5174afb93856d9fc5105e7c04ed50b65628f
      TOPOLVM_IMAGE: ghcr.io/topolvm/topolvm-with-sidecar@sha256:70548dbe0c6addcccf79a557f29e95db2e6dc2cba2102988c91f30086004d0fc
      CONTROLLER_IMAGE: ghcr.io/memeloop-online/memeloop-workspace-control-topolvm-controller@sha256:78da459df4061ddc7c0c39cd7681233d3d9728599f997f62a33ae1a413afa497
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: topolvm/topolvm
          ref: ${{ env.TOPOLVM_SHA }}
          path: topolvm-source
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: topolvm-source/go.mod
          cache: false
      - name: Build the one- and two-worker fixture images
        working-directory: topolvm-source
        run: |
          test "$(git rev-parse HEAD)" = "$TOPOLVM_SHA"
          git apply "$GITHUB_WORKSPACE/images/topolvm-node/independent-operations.patch"
          git apply "$GITHUB_WORKSPACE/tests/topolvm-node/queue-workers.patch"
          gofmt -w internal/controller/logicalvolume_controller.go
          for n in 1 2; do
            out="$RUNNER_TEMP/queue-$n"
            mkdir -p "$out"
            cp "$GITHUB_WORKSPACE/images/topolvm-node/Dockerfile" "$out/"
            CGO_ENABLED=0 go build -buildvcs=false -trimpath \
              -ldflags "-w -s -X github.com/topolvm/topolvm.Version=0.41.1-mwc-queue-$n -X github.com/topolvm/topolvm/internal/controller.benchmarkLogicalVolumeWorkers=$n" \
              -o "$out/topolvm-node" ./cmd/topolvm-node
            if [[ $n == 1 ]]; then label=baseline; else label=patched; fi
            docker build --build-arg "BASE_IMAGE=$TOPOLVM_IMAGE" -t "localhost/topolvm-node-ci:$label" "$out"
          done
      - name: Prepare public images and thin storage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lvm2 thin-provisioning-tools xfsprogs
          sudo modprobe dm_thin_pool
          bash -n tests/topolvm-node/measure-publish.sh
          bash -n tests/topolvm-node/measure-queue.sh
          alpine=docker.io/library/alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          docker pull "$alpine"
          docker pull "$CONTROLLER_IMAGE"
          docker tag "$CONTROLLER_IMAGE" localhost/topolvm-queue-ci:controller
          docker save -o "$RUNNER_TEMP/topolvm-node-images.tar" localhost/topolvm-node-ci:baseline \
            localhost/topolvm-node-ci:patched localhost/topolvm-queue-ci:controller "$alpine"
      - name: Compare real K3s and XFS volumes
        run: |
          proof="$RUNNER_TEMP/topolvm-queue"
          status=0
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT unshare --mount --propagation private \
            bash tests/topolvm-node/measure-publish.sh "$proof" queue || status=$?
          sudo chown -R "$(id -u):$(id -g)" "$proof/evidence"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: topolvm-volume-queues-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/topolvm-queue/evidence
          if-no-files-found: ignore
