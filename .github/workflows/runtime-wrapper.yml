name: native-runtime-prototype
on:
  push:
    branches: ['codex/runtime-budget-ci-prototype']
    paths: ['runtime-wrapper/**', '.github/workflows/runtime-wrapper.yml']
  pull_request:
    paths: ['runtime-wrapper/**', '.github/workflows/runtime-wrapper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.4'
          cache: false
      - name: Format, vet, unit inputs, compile (CI only)
        working-directory: runtime-wrapper
        run: |
          mkdir -p artifacts
          gofmt -w *.go
          git diff -- . > artifacts/gofmt.patch
          cp *.go artifacts/
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/mwc-runtime-prototype/mwc-runtime-wrapper" .
      - name: Prepare disposable privileged runtime fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y lvm2 thin-provisioning-tools xfsprogs jq openssh-client
      - name: Actual pinned CRI and shim acceptance
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP,GITHUB_WORKSPACE unshare --mount --propagation private ./runtime-wrapper/ci/fixture.sh
      - name: Preserve all evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-runtime-prototype-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-wrapper/artifacts/
          if-no-files-found: warn
