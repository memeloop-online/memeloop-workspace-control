name: product-runtime-storage
on:
  push:
    branches: [main]
    paths: ['ops/scratch-runtime/**', 'tests/runtime_product_storage*', 'tests/runtime-product-vm/**', 'src/kubernetes/workspace_pod*', 'src/kubernetes/workspace_pod/**', '.github/workflows/runtime-product-storage.yml']
  pull_request:
    paths: ['ops/scratch-runtime/**', 'tests/runtime_product_storage*', 'tests/runtime-product-vm/**', 'src/kubernetes/workspace_pod*', 'src/kubernetes/workspace_pod/**', '.github/workflows/runtime-product-storage.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
env:
  WRAPPER_SHA: 9e25c9ec773845a7cf84312ca03ae4326866f3e3
  CONTAINERD_BASE_SHA: 7e04eb8fad2b9597d04c8109b67476ab9270bc22
  CONTAINERD_CLEANUP_SHA: e49a475d4a87d25513febbc2e625ddf0f1f447e0
jobs:
  build-inputs:
    name: Compile and verify CSI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Identify the actual renderer and harness checkout
        run: |
          echo "PRODUCT_RENDERER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MWC_PRODUCT_STORAGE_WORKSPACE_IMAGE=localhost/mwc-product-storage-workspace:$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check CSI harness syntax
        run: |
          bash -n tests/runtime_product_storage.sh
          bash -n tests/runtime-product-vm/prepare-public-inputs.sh
          bash -n tests/runtime-product-vm/workspace-reboot-guest.sh
          bash -n ops/scratch-runtime/stage-release.sh
          python3 -m py_compile tests/runtime_product_storage_bdi.py tests/runtime-product-vm/*.py
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: runtime-product-storage
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.WRAPPER_SHA }}
          path: ci-wrapper-source
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build both wrappers from the pinned candidate (CI only)
        working-directory: ci-wrapper-source/runtime-wrapper
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          release="$RUNNER_TEMP/wrapper-release"
          bin="$RUNNER_TEMP/product-storage-bin"
          mkdir -p "$release" "$bin"
          test "$(git rev-parse HEAD)" = "$WRAPPER_SHA"
          test -z "$(git status --porcelain)"
          test -z "$(gofmt -l *.go)"
          go build -buildvcs=true -trimpath -o "$bin/mwc-runtime-wrapper" .
          go build -buildvcs=true -trimpath -tags=mwc_runsc -o "$bin/mwc-runsc-wrapper" .
          for variant in mwc-runtime-wrapper mwc-runsc-wrapper; do
            go version -m "$bin/$variant" | awk '{print $2}' | grep -Fx "vcs.revision=$WRAPPER_SHA"
          done
          (cd "$bin" && sha256sum mwc-runtime-wrapper mwc-runsc-wrapper > "$release/SHA256SUMS")
          jq -n --arg sha "$WRAPPER_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{source_sha:$sha,run_id:$run,run_attempt:$attempt,platform:"linux/amd64",variants:["native","runsc"]}' > "$release/artifact-identity.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: k3s-io/containerd
          ref: ${{ env.CONTAINERD_BASE_SHA }}
          path: ci-containerd-source
          persist-credentials: false
      - name: Build the K3s Containerd daemon with the upstream cleanup patch (CI only)
        working-directory: ci-containerd-source
        env:
          CGO_ENABLED: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$CONTAINERD_BASE_SHA"
          test -z "$(git status --porcelain)"
          patch="$RUNNER_TEMP/containerd-shim-cleanup.patch"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/containerd/containerd/commit/$CONTAINERD_CLEANUP_SHA.patch" -o "$patch"
          printf '%s  %s\n' 77a03be9caa231cb6e69f6393217083f70df5778048ec808fbe59e2e10d1539e "$patch" | sha256sum -c -
          git apply --include=core/runtime/v2/shim_manager.go "$patch"
          test "$(git diff --name-only)" = core/runtime/v2/shim_manager.go
          git diff --check
          make VERSION=v2.3.2-k3s2-shim-cleanup REVISION="$CONTAINERD_BASE_SHA+$CONTAINERD_CLEANUP_SHA" bin/containerd
          install -m 0755 bin/containerd "$RUNNER_TEMP/product-storage-bin/containerd-shim-cleanup"
          mkdir -p "$RUNNER_TEMP/containerd-licenses"
          cp LICENSE NOTICE "$RUNNER_TEMP/containerd-licenses/"
      - name: Build exact renderer fixtures and probe (CI only)
        run: |
          mkdir -p artifacts "$RUNNER_TEMP/product-storage-fixtures" "$RUNNER_TEMP/product-storage-bin"
          (cd web && npm ci && npm run build)
          cargo test --locked --lib kubernetes::workspace_pod::tests
          MWC_PRODUCT_STORAGE_FIXTURES="$RUNNER_TEMP/product-storage-fixtures" cargo test --locked --test runtime_product_storage -- --nocapture
          test "$(find "$RUNNER_TEMP/product-storage-fixtures" -name '*.json' | wc -l)" = 4
          gcc -static -O2 -Wall -Wextra -Werror tests/runtime_product_storage_probe.c -o "$RUNNER_TEMP/product-storage-bin/mwc-budget-probe"
          cp "$RUNNER_TEMP/product-storage-fixtures/"*.json artifacts/
      - name: Export exact compiled inputs without private registry access
        run: |
          mkdir -p input-bundle/bin input-bundle/fixtures input-bundle/wrapper-release
          cp "$RUNNER_TEMP/product-storage-bin/"* input-bundle/bin/
          cp "$RUNNER_TEMP/product-storage-fixtures/"*.json input-bundle/fixtures/
          cp "$RUNNER_TEMP/wrapper-release/"{SHA256SUMS,artifact-identity.json} input-bundle/wrapper-release/
          cp -a "$RUNNER_TEMP/containerd-licenses" input-bundle/
          jq -n --arg renderer "$PRODUCT_RENDERER_SHA" --arg wrapper "$WRAPPER_SHA" \
            --arg harness "$(git rev-parse HEAD)" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{renderer_sha:$renderer,wrapper_sha:$wrapper,harness_sha:$harness,run_id:$run,run_attempt:$attempt}' > input-bundle/source-shas.json
          (cd input-bundle && sha256sum bin/* fixtures/* wrapper-release/* containerd-licenses/* source-shas.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-storage-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: input-bundle/
          if-no-files-found: error
  rust-topolvm:
    needs: build-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Identify the actual renderer and harness checkout
        run: |
          echo "PRODUCT_RENDERER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MWC_PRODUCT_STORAGE_WORKSPACE_IMAGE=localhost/mwc-product-storage-workspace:$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-storage-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: input-bundle/
      - name: Verify immutable compiled inputs
        run: |
          (cd input-bundle && sha256sum -c SHA256SUMS)
          (cd input-bundle/bin && sha256sum -c ../wrapper-release/SHA256SUMS)
          jq -e --arg renderer "$PRODUCT_RENDERER_SHA" --arg wrapper "$WRAPPER_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '.renderer_sha==$renderer and .harness_sha==$renderer and .wrapper_sha==$wrapper and .run_id==$run and .run_attempt==$attempt' input-bundle/source-shas.json
          jq -e --arg sha "$WRAPPER_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '.source_sha==$sha and .run_id==$run and .run_attempt==$attempt and .platform=="linux/amd64" and .variants==["native","runsc"]' input-bundle/wrapper-release/artifact-identity.json
          mkdir -p artifacts "$RUNNER_TEMP/product-storage-fixtures" "$RUNNER_TEMP/product-storage-bin"
          cp input-bundle/bin/* "$RUNNER_TEMP/product-storage-bin/"
          chmod 0755 "$RUNNER_TEMP/product-storage-bin/"*
          cp input-bundle/fixtures/* "$RUNNER_TEMP/product-storage-fixtures/"
          cp -a input-bundle/wrapper-release artifacts/
          cp input-bundle/source-shas.json artifacts/compiled-source-shas.json
      - name: Prepare disposable real CSI node
        run: |
          sudo apt-get update
          sudo apt-get install -y lvm2 thin-provisioning-tools xfsprogs jq openssh-client bzip2 curl conntrack socat ethtool ebtables iptables kmod qemu-system-x86 qemu-utils cloud-image-utils
          # The runner contains several SDKs unused by this isolated VM experiment.
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -B1 / | tee artifacts/runner-capacity-before.txt
          free -b | tee artifacts/runner-memory-before.txt
          test "$(df -B1 --output=avail / | tail -n1)" -ge 30000000000
          test "$(awk '/MemTotal:/ {print $2}' /proc/meminfo)" -ge 6000000
      - name: Prepare public inputs on this GitHub runner
        run: |
          bash tests/runtime-product-vm/prepare-public-inputs.sh "$RUNNER_TEMP/product-storage-inputs"
          echo "MWC_PRODUCT_STORAGE_INPUTS=$RUNNER_TEMP/product-storage-inputs" >> "$GITHUB_ENV"
      - name: Expand both workspace PVCs online and boot again with the same volumes
        run: |
          proof="$RUNNER_TEMP/workspace-node-reboot"
          mkdir -p artifacts/workspace-node-reboot
          status=0
          bash ops/scratch-runtime/ci/reboot.sh "$proof" workspace || status=$?
          for file in boot-evidence.jsonl k3s-guest.log workspace-before.json workspace-grow.json workspace-after.json workspace-reclaimed.json containerd-after-rollback.txt; do
            if [[ -f "$proof/$file" ]]; then cp "$proof/$file" artifacts/workspace-node-reboot/; fi
          done
          rm -f "$proof/"{noble.img,home.raw,scratch.raw}
          exit "$status"
      - name: Actual Rust product and TopoLVM lifecycle
        run: |
          status=0
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_WORKSPACE,RUNNER_TEMP,PRODUCT_RENDERER_SHA,WRAPPER_SHA,MWC_PRODUCT_STORAGE_INPUTS \
            unshare --mount --propagation private bash tests/runtime_product_storage.sh || status=$?
          sudo chown -R "$(id -u):$(id -g)" artifacts
          exit "$status"
      - name: Package the runtime files from this passing CSI run
        run: |
          bash ops/scratch-runtime/stage-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scratch-runtime-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scratch-runtime-oci/
          if-no-files-found: error
      - name: Preserve actual evidence, including failed prerequisites
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-product-topolvm-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
  publish-runtime-bundle:
    needs: rust-topolvm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scratch-runtime-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: scratch-runtime-oci
      - name: Verify release bytes and identity
        id: release
        run: |
          archive=scratch-runtime-oci/mwc-scratch-runtime-linux-amd64.tar.gz
          extracted="$RUNNER_TEMP/verified-runtime"
          mkdir "$extracted"
          tar -xzf "$archive" -C "$extracted"
          (cd "$extracted" && sha256sum --strict -c SHA256SUMS)
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '.renderer_sha==$sha and .harness_sha==$sha and .run_id==$run and .run_attempt==$attempt' "$extracted/identity.json"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: scratch-runtime-oci
          file: ops/scratch-runtime/release.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.repository }}:scratch-runtime-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record the immutable runtime bundle
        env:
          REPOSITORY: ${{ steps.release.outputs.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          printf 'Verified scratch runtime: `%s@%s`\n' "$REPOSITORY" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          if-no-files-found: error
