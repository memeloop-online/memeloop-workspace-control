name: TopoLVM thin allocation

on:
  pull_request:
    paths:
      - .github/workflows/topolvm-thin-allocation.yml
      - images/topolvm-lvmd/Dockerfile
      - images/topolvm-node/thin-allocation-report.patch
      - tests/topolvm-node/thin_allocation_test.go
      - tests/topolvm-node/measure-lvmd.sh
      - tests/topolvm-node/measure-publish.sh
      - tests/runtime-product-vm/topolvm-values.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/topolvm-thin-allocation.yml
      - images/topolvm-lvmd/Dockerfile
      - images/topolvm-node/thin-allocation-report.patch
      - tests/topolvm-node/thin_allocation_test.go
      - tests/topolvm-node/measure-lvmd.sh
      - tests/topolvm-node/measure-publish.sh
      - tests/runtime-product-vm/topolvm-values.yaml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPOLVM_SHA: 2d0c5174afb93856d9fc5105e7c04ed50b65628f
      BASE_IMAGE: ghcr.io/memeloop-online/memeloop-workspace-control-topolvm-controller@sha256:4d3edf502ca487d75c02bf9f5e55bdb4e1d65eb966987b46a782cf4ed23c360f
      CANDIDATE: localhost/lvmd-ci:patched
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: topolvm/topolvm
          ref: ${{ env.TOPOLVM_SHA }}
          path: topolvm-source
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: topolvm-source/go.mod
          cache: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare thin storage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lvm2 thin-provisioning-tools xfsprogs skopeo
          sudo modprobe dm_thin_pool
          mkdir -p "$RUNNER_TEMP/lvm-evidence"
          cat > "$RUNNER_TEMP/lvm-evidence/trace-lvm" <<'SH'
          #!/bin/sh
          printf '%s\n' "$1" >> "$MWC_LVM_TRACE"
          exec lvm "$@"
          SH
          chmod +x "$RUNNER_TEMP/lvm-evidence/trace-lvm"
      - name: Build both cases at the same source revision
        working-directory: topolvm-source
        run: |
          test "$(git rev-parse HEAD)" = "$TOPOLVM_SHA"
          out="$RUNNER_TEMP/lvm-evidence"
          cp "$GITHUB_WORKSPACE/tests/topolvm-node/thin_allocation_test.go" internal/lvmd/mwc_allocation_test.go
          test -z "$(gofmt -l internal/lvmd/mwc_allocation_test.go)"
          go test -c -o "$out/baseline" ./internal/lvmd
          git apply --unidiff-zero "$GITHUB_WORKSPACE/images/topolvm-node/thin-allocation-report.patch"
          test -z "$(gofmt -l internal/lvmd/{command/lvm,lvservice,pool}.go)"
          go test -c -o "$out/candidate" ./internal/lvmd
      - name: Measure thin allocation and verify native capacity and resize
        run: |
          out="$RUNNER_TEMP/lvm-evidence"
          touch "$out/lvm.trace"
          for arm in baseline candidate candidate baseline; do
            sudo env "MWC_TRACE_LVM=$out/trace-lvm" "MWC_LVM_TRACE=$out/lvm.trace" \
              "$out/$arm" -test.run '^TestMWCThinAllocationReport$' -test.v | tee -a "$out/$arm.log"
          done
          sudo "$out/candidate" -test.run '^TestLVService_(ThinLV|ThickLV|ThinSnapshots)$' -test.v | tee "$out/regression.log"
          python3 - "$out" <<'PY'
          import json, pathlib, re, statistics, sys
          p = pathlib.Path(sys.argv[1])
          result = {}
          for arm, expected in (('baseline', 'vgs,lvs,lvs,lvcreate,lvs'), ('candidate', 'lvs,lvcreate,lvs')):
              rows = re.findall(r'MWC_ALLOC (\d+) (\S+)', (p / f'{arm}.log').read_text())
              assert len(rows) == 24 and {seq for _, seq in rows} == {expected}, (arm, rows)
              elapsed = sorted(int(us) / 1000 for us, _ in rows)
              result[arm] = {'count': len(rows), 'lvm_commands': expected.split(','), 'median_ms': statistics.median(elapsed), 'elapsed_ms': elapsed}
          (p / 'allocation-comparison.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps({arm: d['median_ms'] for arm, d in result.items()}))
          PY
      - name: Prepare the exact LVMD image
        working-directory: topolvm-source
        run: |
          out="$RUNNER_TEMP/lvmd-image"
          mkdir -p "$out"
          cp "$GITHUB_WORKSPACE/images/topolvm-lvmd/Dockerfile" "$out/"
          CGO_ENABLED=0 go build -buildvcs=false -trimpath \
            -ldflags '-w -s -X github.com/topolvm/topolvm.Version=0.41.1-mwc-thin-allocation' \
            -o "$out/lvmd" ./cmd/lvmd
          docker buildx build --platform linux/amd64 --provenance=false \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            --output "type=oci,dest=$out/lvmd.oci.tar,compression=gzip,force-compression=false" "$out"
          archive="$out/lvmd.oci.tar"
          digest=$(tar -xOf "$archive" index.json | jq -er '[.manifests[].digest] | select(length==1) | .[0]')
          tar -xOf "$archive" "blobs/sha256/${digest#sha256:}" > "$out/manifest.json"
          test "$digest" = "sha256:$(sha256sum "$out/manifest.json" | cut -d' ' -f1)"
          echo "$digest" > "$out/manifest-digest.txt"
          jq -er '.config.digest' "$out/manifest.json" > "$out/config-digest.txt"
          skopeo inspect --raw "docker://$BASE_IMAGE" > "$out/base.json"
          if jq -e 'has("manifests")' "$out/base.json" >/dev/null; then
            platform=$(jq -er '[.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest] | select(length==1) | .[0]' "$out/base.json")
            skopeo inspect --raw "docker://${BASE_IMAGE%@*}@$platform" > "$out/base.json"
          fi
          jq -e --slurpfile base "$out/base.json" '
            ($base[0].layers | length) as $n
            | select((.layers | length) == $n+1)
            | select([.layers[:$n][].digest] == [$base[0].layers[].digest])
            | {reused_layers:$n, new_layer_bytes:.layers[-1].size, new_layer:.layers[-1].digest}
          ' "$out/manifest.json" | tee "$RUNNER_TEMP/lvm-evidence/lvmd-layer.json"
          skopeo copy "oci-archive:$archive" "docker-daemon:$CANDIDATE"
          test "$(docker image inspect "$CANDIDATE" --format '{{.Id}}')" = "$(cat "$out/config-digest.txt")"
          docker run --rm --entrypoint /lvmd "$CANDIDATE" --version |
            grep -Fx 'lvmd version 0.41.1-mwc-thin-allocation'
          docker pull "$BASE_IMAGE"
          docker tag "$BASE_IMAGE" localhost/lvmd-ci:baseline
          alpine=docker.io/library/alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          docker pull "$alpine"
          docker save -o "$RUNNER_TEMP/lvmd-images.tar" "$CANDIDATE" localhost/lvmd-ci:baseline "$alpine"
      - name: Verify create, resize, reclamation and rollback in real K3s
        run: |
          proof="$RUNNER_TEMP/lvmd-csi"
          status=0
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT unshare --mount --propagation private \
            bash tests/topolvm-node/measure-publish.sh "$proof" lvmd || status=$?
          sudo chown -R "$(id -u):$(id -g)" "$proof/evidence"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: topolvm-thin-allocation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lvm-evidence/*.log
            ${{ runner.temp }}/lvm-evidence/allocation-comparison.json
            ${{ runner.temp }}/lvm-evidence/lvmd-layer.json
            ${{ runner.temp }}/lvmd-csi/evidence
          if-no-files-found: ignore
      - name: Preserve the tested OCI image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          out="$RUNNER_TEMP/lvmd-image"
          test "$(docker image inspect "$CANDIDATE" --format '{{.Id}}')" = "$(cat "$out/config-digest.txt")"
          (cd "$out" && sha256sum manifest-digest.txt lvmd.oci.tar > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-topolvm-lvmd-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lvmd-image/lvmd.oci.tar
            ${{ runner.temp }}/lvmd-image/manifest-digest.txt
            ${{ runner.temp }}/lvmd-image/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: compare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-topolvm-node
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-topolvm-lvmd-${{ github.sha }}-${{ github.run_attempt }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the OCI copy utility
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Publish the exact tested image
        id: push
        run: |
          sha256sum -c SHA256SUMS
          digest=$(cat manifest-digest.txt)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          tag="$IMAGE:lvmd-sha-$GITHUB_SHA"
          skopeo copy --preserve-digests --dest-authfile "${DOCKER_CONFIG:-$HOME/.docker}/config.json" \
            oci-archive:lvmd.oci.tar "docker://$tag"
          published=$(skopeo inspect --raw "docker://$tag" | sha256sum | cut -d' ' -f1)
          test "sha256:$published" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
