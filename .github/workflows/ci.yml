name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: web
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Verify Helm chart
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz -o helm.tgz
          printf '%s  %s\n' c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 helm.tgz | sha256sum -c -
          tar -xzf helm.tgz
          linux-amd64/helm lint deploy/helm/memeloop-workspace-control \
            --set installationId=ci-a \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false
          linux-amd64/helm lint deploy/helm/memeloop-workspace-control \
            -f deploy/helm/memeloop-workspace-control/values.example.yaml
          linux-amd64/helm template digest-pinned deploy/helm/memeloop-workspace-control \
            --set installationId=digest-pinned \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            | grep -q 'memeloop-workspace-control@sha256:aaaaaaaa'
          if linux-amd64/helm template bad-digest deploy/helm/memeloop-workspace-control \
            --set installationId=bad-digest \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set image.digest=latest >/dev/null 2>&1; then
            echo "malformed image digest was accepted" >&2
            exit 1
          fi
          if linux-amd64/helm template unsafe deploy/helm/memeloop-workspace-control \
            --set installationId=unsafe \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set public.webShellDomain=shell.example.com \
            --set public.webShellOrigin=https://shell.example.com >/dev/null 2>&1; then
            echo "unsafe Web Shell route rendered without external-auth" >&2
            exit 1
          fi

  publish-images:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            context: .
            dockerfile: Dockerfile
            description: Memeloop workspace control plane
          - suffix: -workspace
            context: images/workspace-base
            dockerfile: images/workspace-base/Dockerfile
            description: Image Contract v1 OpenSSH workspace base
          - suffix: -ssh-jump
            context: images/ssh-jump
            dockerfile: images/ssh-jump/Dockerfile
            description: Restricted standard OpenSSH jump host
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix || 'control-plane' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix || 'control-plane' }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
