name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      image-inputs-changed: ${{ steps.image-inputs.outputs.changed }}
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: mwc_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mwc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: image-inputs
        name: Detect container image input changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            changed=true
          elif [ "${EVENT_NAME}" != "push" ]; then
            changed=false
          elif [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            changed=true
          elif git diff --quiet "${BEFORE_SHA}" "${CURRENT_SHA}" -- \
            .dockerignore Cargo.toml Cargo.lock Dockerfile src web images \
            tests/workspace_bootstrap_enospc.sh .github/workflows/ci.yml; then
            changed=false
          else
            changed=true
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run check && npm test && npm run build
        working-directory: web
      - name: Enforce the current data-model vocabulary
        run: |
          for prohibited in 'leg''acy' 'leg''acy_v1' 'pre''fixed_v2' 'runtime''_profile'; do
            if rg -n -i --glob '!target/**' --glob '!node_modules/**' -e "${prohibited}" .; then
              echo "obsolete data-model vocabulary found" >&2
              exit 1
            fi
          done
      - run: cargo fmt --all -- --check
      - name: Verify node installer rollback fixtures
        run: bash tests/gvisor_node_scripts.sh
      - name: Enforce production maintainability limits
        run: >-
          cargo clippy --locked --lib --bins --all-features --
          -D warnings
          -D clippy::too-many-lines
          -D clippy::cognitive-complexity
          -D clippy::type-complexity
          -D clippy::too-many-arguments
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features --no-fail-fast
        env:
          MWC_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/mwc_test
      - name: Verify workspace bootstrap survives a full Home
        run: |
          docker build -t mwc-workspace-enospc images/workspace-base
          docker run --rm --entrypoint /bin/sh \
            --tmpfs /workspace:size=8m,mode=0750 \
            --tmpfs /run/mwc-ssh:size=16m,mode=0700 \
            --tmpfs /var/lib/mwc/build-scratch:size=32m,mode=0770 \
            --tmpfs /var/lib/mwc/codex-scratch:size=4m,mode=0770 \
            -v "$PWD/tests/workspace_bootstrap_enospc.sh:/test-enospc:ro" \
            mwc-workspace-enospc /test-enospc
      - name: Verify Helm chart
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz -o helm.tgz
          printf '%s  %s\n' c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 helm.tgz | sha256sum -c -
          tar -xzf helm.tgz
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz -o prometheus.tgz
          printf '%s  %s\n' f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d prometheus.tgz | sha256sum -c -
          tar -xzf prometheus.tgz prometheus-3.14.0.linux-amd64/promtool
          promtool=prometheus-3.14.0.linux-amd64/promtool
          linux-amd64/helm lint deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=ci-a \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false
          linux-amd64/helm lint deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            -f deploy/helm/memeloop-workspace-control/values.example.yaml
          rendered_public=$(linux-amd64/helm template public \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            -f deploy/helm/memeloop-workspace-control/values.example.yaml)
          grep -q 'phase: AUTHN' <<<"${rendered_public}"
          grep -q 'priority: 360' <<<"${rendered_public}"
          grep -q 'failStrategy: FAIL_CLOSE' <<<"${rendered_public}"
          grep -q 'defaultConfigDisable: true' <<<"${rendered_public}"
          grep -q 'matchRules:' <<<"${rendered_public}"
          test "$(grep -c '^  name: mwc-public-a-access-auth$' <<<"${rendered_public}")" -eq 1
          if grep -q -- 'mwc-public-a-\(web-shell\|port-mapping\)-auth' <<<"${rendered_public}"; then
            echo "obsolete split access-auth plugins were rendered" >&2
            exit 1
          fi
          grep -q -- '- "shell.example.com"' <<<"${rendered_public}"
          grep -q -- '- "\*.example.com"' <<<"${rendered_public}"
          web_rule_line=$(grep -n -- '- "shell.example.com"' <<<"${rendered_public}" | head -n1 | cut -d: -f1)
          port_rule_line=$(grep -n -- '- "\*.example.com"' <<<"${rendered_public}" | head -n1 | cut -d: -f1)
          test "${web_rule_line}" -lt "${port_rule_line}"
          grep -q 'path: /api/v1/internal/web-shell/authorize' <<<"${rendered_public}"
          grep -q 'path: /api/v1/internal/port-mappings/authorize' <<<"${rendered_public}"
          grep -q 'service_name: mwc-public-a.memeloop-workspace-control.svc.cluster.local' <<<"${rendered_public}"
          grep -q 'name: MWC_HIGRESS_SOURCE_CIDRS_JSON' <<<"${rendered_public}"
          grep -q 'resources: \["networkpolicies", "ingresses"\]' <<<"${rendered_public}"
          rendered_mtls=$(linux-amd64/helm template mtls \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            -f deploy/helm/memeloop-workspace-control/values.example.yaml \
            --set workspace.ttydMtls.serverTlsSecretName=ttyd-server \
            --set higress.ttydMtls.clientSecretNamespace=higress-system \
            --set higress.ttydMtls.clientSecretName=ttyd-client)
          for variable in MWC_TTYD_MTLS_SERVER_SECRET MWC_HIGRESS_MTLS_CLIENT_SECRET_NAMESPACE MWC_HIGRESS_MTLS_CLIENT_SECRET_NAME; do
            grep -q "name: ${variable}" <<<"${rendered_mtls}"
          done
          if linux-amd64/helm template incomplete-mtls \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            -f deploy/helm/memeloop-workspace-control/values.example.yaml \
            --set workspace.ttydMtls.serverTlsSecretName=ttyd-server \
            > /dev/null 2> incomplete-mtls.log; then
            echo "incomplete ttyd mTLS configuration was accepted" >&2
            exit 1
          fi
          grep -q 'must be set together' incomplete-mtls.log
          linux-amd64/helm lint deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            -f deploy/helm/memeloop-workspace-control/values.internal.example.yaml
          rendered_sqlite_default=$(linux-amd64/helm template sqlite-default \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=sqlite-default \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set autoscaling.enabled=false)
          grep -q '^  persistentVolumeClaimRetentionPolicy:$' <<<"${rendered_sqlite_default}"
          grep -q '^    whenDeleted: Retain$' <<<"${rendered_sqlite_default}"
          grep -q '^    whenScaled: Retain$' <<<"${rendered_sqlite_default}"
          grep -q '^  volumeClaimTemplates:$' <<<"${rendered_sqlite_default}"
          if invalid_namespace_output=$(linux-amd64/helm template wrong-namespace \
            deploy/helm/memeloop-workspace-control \
            --namespace default \
            --set installationId=wrong-namespace \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set autoscaling.enabled=false 2>&1); then
            echo "chart accepted a non-canonical release namespace" >&2
            exit 1
          fi
          grep -q 'the release namespace must be memeloop-workspace-control' \
            <<<"${invalid_namespace_output}"
          rendered_existing_claim=$(linux-amd64/helm template sqlite-existing \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=sqlite-existing \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set sqlite.existingClaim=control-plane-data \
            --set jumpHost.enabled=false \
            --set autoscaling.enabled=false)
          grep -q '^            claimName: "control-plane-data"$' <<<"${rendered_existing_claim}"
          if grep -q '^  volumeClaimTemplates:$' <<<"${rendered_existing_claim}"; then
            echo "SQLite existingClaim rendered a volumeClaimTemplate" >&2
            exit 1
          fi
          if postgres_claim_output=$(linux-amd64/helm template postgres-existing \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=postgres-existing \
            --set mode=postgresql \
            --set database.postgresSecretName=database \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set sqlite.existingClaim=control-plane-data \
            --set jumpHost.enabled=false \
            --set autoscaling.enabled=false 2>&1); then
            echo "PostgreSQL mode accepted sqlite.existingClaim" >&2
            exit 1
          fi
          grep -q 'sqlite.existingClaim may only be set in sqlite mode' <<<"${postgres_claim_output}"
          if storage_claim_output=$(linux-amd64/helm template sqlite-sc-conflict \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=sqlite-sc-conflict \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set sqlite.existingClaim=control-plane-data \
            --set sqlite.storageClassName=local-path \
            --set jumpHost.enabled=false \
            --set autoscaling.enabled=false 2>&1); then
            echo "SQLite existingClaim accepted a provisioning StorageClass" >&2
            exit 1
          fi
          grep -q 'sqlite.existingClaim and sqlite.storageClassName are mutually exclusive' \
            <<<"${storage_claim_output}"
          linux-amd64/helm template digest-pinned deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=digest-pinned \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            | grep -q 'memeloop-workspace-control@sha256:aaaaaaaa'
          rendered_monitoring=$(linux-amd64/helm template monitoring \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=monitoring \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set monitoring.serviceMonitor.enabled=true \
            --set monitoring.diagnostics.enabled=true \
            --set monitoring.prometheusRule.enabled=true \
            --set monitoring.serviceMonitor.labels.release=monitoring)
          grep -q 'kind: ServiceMonitor' <<<"${rendered_monitoring}"
          grep -q 'release: monitoring' <<<"${rendered_monitoring}"
          grep -q 'path: /metrics' <<<"${rendered_monitoring}"
          grep -q 'port: auth' <<<"${rendered_monitoring}"
          grep -q 'name: MWC_DIAGNOSTICS_ENABLED' <<<"${rendered_monitoring}"
          grep -q 'path: /livez' <<<"${rendered_monitoring}"
          grep -q 'name: diagnostics-tmp' <<<"${rendered_monitoring}"
          grep -q 'kubernetes.io/metadata.name: "monitoring"' <<<"${rendered_monitoring}"
          grep -q 'kind: PrometheusRule' <<<"${rendered_monitoring}"
          grep -q 'record: mwc_workspace_home_used_percent' <<<"${rendered_monitoring}"
          grep -q 'alert: MwcWorkspaceHomeStorageWarning' <<<"${rendered_monitoring}"
          grep -q 'alert: MwcWorkspaceHomeStorageCritical' <<<"${rendered_monitoring}"
          grep -q 'record: mwc_node_workspace_ephemeral_storage_requested_bytes' <<<"${rendered_monitoring}"
          grep -q 'record: mwc_node_ephemeral_storage_requested_percent' <<<"${rendered_monitoring}"
          grep -q 'alert: MwcNodeEphemeralStorageRequestsWarning' <<<"${rendered_monitoring}"
          grep -q 'alert: MwcNodeEphemeralStorageRequestsCritical' <<<"${rendered_monitoring}"
          grep -q 'alert: MwcNodeDiskPressure' <<<"${rendered_monitoring}"
          grep -q 'alert: MwcJobsFailed' <<<"${rendered_monitoring}"
          grep -q 'clamp_min(delta(mwc_jobs{status="failed"}\[15m\]), 0) > 0' <<<"${rendered_monitoring}"
          grep -q 'alert: MwcJobsPendingTooOld' <<<"${rendered_monitoring}"
          grep -q 'kube_pod_spec_volumes_persistentvolumeclaims_info' <<<"${rendered_monitoring}"
          grep -q 'kube_pod_labels{label_workspace_memeloop_dev_owner_installation="monitoring",label_workspace_memeloop_dev_workspace_id!=""}' <<<"${rendered_monitoring}"
          if grep -q 'kube_persistentvolumeclaim_labels' <<<"${rendered_monitoring}"; then
            echo "Prometheus rules unexpectedly depend on non-allowlisted PVC labels" >&2
            exit 1
          fi
          if grep -Eq '(by|without|group_left|group_right)[[:space:]]*\([^)]*(workspace_id|label_workspace_memeloop_dev_workspace_id)' \
            <<<"${rendered_monitoring}"; then
            echo "Prometheus rules propagate workspace UUIDs into output labels" >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]+(workspace_id|label_workspace_memeloop_dev_workspace_id):' \
            <<<"${rendered_monitoring}"; then
            echo "Prometheus rule output labels contain a workspace UUID dimension" >&2
            exit 1
          fi
          rendered_prometheus_rule=$(linux-amd64/helm template monitoring-rules \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --show-only templates/prometheusrule.yaml \
            --set installationId=monitoring \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set monitoring.prometheusRule.enabled=true)
          sed -n '/^  groups:$/,$p' <<<"${rendered_prometheus_rule}" \
            | sed 's/^  //' > /tmp/mwc-prometheus-rules.yaml
          test -s /tmp/mwc-prometheus-rules.yaml
          "${promtool}" check rules /tmp/mwc-prometheus-rules.yaml
          grep -q '>= 80' <<<"${rendered_monitoring}"
          grep -q '>= 90' <<<"${rendered_monitoring}"
          rendered_ports=$(linux-amd64/helm template ports \
            deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=ports \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set public.portMappingDomain=example.com \
            --set higress.extAuthPluginUrl=oci://example.invalid/ext-auth@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa)
          grep -q 'name: MWC_PORT_MAPPING_PUBLIC_DOMAIN' <<<"${rendered_ports}"
          grep -q -- '- "\*.example.com"' <<<"${rendered_ports}"
          grep -q 'match_rule_domain: "p-\*.example.com"' <<<"${rendered_ports}"
          grep -q 'path: /api/v1/internal/port-mappings/authorize' <<<"${rendered_ports}"
          grep -q 'allowed_headers:' <<<"${rendered_ports}"
          grep -q -- '- exact: cookie' <<<"${rendered_ports}"
          grep -q -- '- exact: set-cookie' <<<"${rendered_ports}"
          grep -q -- '- exact: location' <<<"${rendered_ports}"
          grep -q 'name: external-auth' <<<"${rendered_ports}"
          if linux-amd64/helm template unsafe-ports deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=unsafe-ports \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set public.portMappingDomain=example.com >/dev/null 2>&1; then
            echo "unsafe port mapping route rendered without external-auth" >&2
            exit 1
          fi
          if linux-amd64/helm template bad-digest deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=bad-digest \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set image.digest=latest >/dev/null 2>&1; then
            echo "malformed image digest was accepted" >&2
            exit 1
          fi
          if linux-amd64/helm template unsafe deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=unsafe \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set public.webShellDomain=shell.example.com \
            --set public.webShellOrigin=https://shell.example.com >/dev/null 2>&1; then
            echo "unsafe Web Shell route rendered without external-auth" >&2
            exit 1
          fi
          if linux-amd64/helm template unsafe-network deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            --set installationId=unsafe-network \
            --set secrets.encryptionSecretName=enc \
            --set secrets.internalAuthSecretName=auth \
            --set workspace.ttydImage=tsl0922/ttyd:1.7.7 \
            --set jumpHost.enabled=false \
            --set public.webShellDomain=shell.example.com \
            --set public.webShellOrigin=https://shell.example.com \
            --set higress.extAuthPluginUrl=oci://example.invalid/ext-auth@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set networkPolicy.enabled=false >/dev/null 2>&1; then
            echo "unsafe Web Shell route rendered without NetworkPolicy" >&2
            exit 1
          fi
          if linux-amd64/helm template invalid-hpa deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            -f deploy/helm/memeloop-workspace-control/values.example.yaml \
            --set resources.requests.cpu=null >/dev/null 2>&1; then
            echo "HPA rendered without a CPU request" >&2
            exit 1
          fi
          if linux-amd64/helm template invalid-selector deploy/helm/memeloop-workspace-control \
            --namespace memeloop-workspace-control \
            -f deploy/helm/memeloop-workspace-control/values.example.yaml \
            --set higress.podLabels=null >/dev/null 2>&1; then
            echo "public Web Shell rendered without a Higress Pod selector" >&2
            exit 1
          fi
          bash -n scripts/k3s/preflight.sh \
            scripts/k3s/verify-installation.sh \
            scripts/k3s/verify-workspace-cleanup.sh \
            tests/k3s_preflight.sh \
            tests/k3s_verify_installation.sh \
            tests/k3s_verify_workspace_cleanup.sh
          bash tests/k3s_preflight.sh
          bash tests/k3s_verify_installation.sh
          bash tests/k3s_verify_workspace_cleanup.sh

  publish-images:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.verify.outputs.image-inputs-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            context: .
            dockerfile: Dockerfile
            description: Memeloop workspace control plane
          - suffix: -workspace
            context: images/workspace-base
            dockerfile: images/workspace-base/Dockerfile
            description: Image Contract v1 OpenSSH workspace base
          - suffix: -ssh-jump
            context: images/ssh-jump
            dockerfile: images/ssh-jump/Dockerfile
            description: Restricted standard OpenSSH jump host
          - suffix: -ttyd
            context: images/ttyd-ssh
            dockerfile: images/ttyd-ssh/Dockerfile
            description: Stock ttyd with the standard OpenSSH client
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix || 'control-plane' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix || 'control-plane' }}
      - name: Verify workspace Image Contract v1 runtime
        if: matrix.suffix == '-workspace'
        env:
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --entrypoint /bin/sh \
            "${IMAGE_NAME}@${PUBLISHED_DIGEST}" -ec '
              test -x /usr/local/bin/mwc-workspace-bootstrap
              command -v ssh-keygen
              command -v jq
              command -v install
              command -v sshd
              test "$(id -u workspace)" -gt 0
              test "$(passwd --status workspace | cut -d " " -f 2)" = NP
              install -d /etc/ssh/platform
              install -d /etc/workspace-platform
              install -m 0600 /dev/null /etc/workspace-platform/sshd_config
              ssh-keygen -q -t ed25519 -N "" -f /etc/ssh/platform/ssh_host_ed25519_key
              chown root:root /workspace
              chmod 0777 /workspace
              /usr/local/bin/mwc-workspace-bootstrap prepare
              test "$(stat -c %a /workspace)" = 750
              test "$(stat -c %U:%G /workspace)" = workspace:workspace
            '
      - name: Verify ttyd can launch the stock OpenSSH client
        if: matrix.suffix == '-ttyd'
        env:
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker run --rm --entrypoint /bin/sh \
            "${IMAGE_NAME}@${PUBLISHED_DIGEST}" -ec '
              test -x /usr/bin/ttyd
              test -x /usr/bin/ssh
              /usr/bin/ssh -V
            '
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
