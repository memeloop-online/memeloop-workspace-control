installationId: ""
mode: sqlite

image:
  repository: memeloop-workspace-control
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2
serviceAccount:
  create: true

database:
  postgresSecretName: ""
  postgresSecretKey: database-url

secrets:
  encryptionSecretName: ""
  encryptionSecretKey: encryption-key
  internalAuthSecretName: ""
  internalAuthSecretKey: internal-auth-token

sqlite:
  # Mount a pre-created PVC instead of generating a StatefulSet claim template.
  existingClaim: ""
  storageClassName: ""
  size: 10Gi

workspace:
  storageClassName: ""
  ttydImage: ""
  ttydMtls:
    # Existing cert-manager-managed server Secret in the product namespace. It
    # contains ttyd's `tls.crt` and `tls.key`; it is mounted only by ttyd.
    serverTlsSecretName: ""
    # Existing client-trust Secret in the product namespace containing only
    # `ca.crt`. It remains separate so cert-manager may renew the server Secret.
    clientCaSecretName: ""
  # Stable Tailnet node DNS name or IP. Enables per-workspace, auto-assigned SSH NodePorts.
  internalSshHost: ""
  egress:
    # Select only the DNS Pods that internet_only templates may query on UDP/TCP 53.
    dnsNamespace: kube-system
    dnsPodLabels:
      k8s-app: kube-dns
    # Add public node IPs and nonstandard Pod/Service CIDRs that must not be reachable.
    additionalBlockedCidrs: []
    # Resolve these public DNS names and retain every observed address as an additional block.
    dynamicBlockedHosts: []
    publicDnsServers:
      - 1.1.1.1
      - 1.0.0.1
    dynamicRefreshSeconds: 300

# Optional read-only startup packages can be supplied by ConfigMap or PVC.
# Dynamically inspected and administrator-approved packages are persisted in
# the authoritative database and hot-reloaded; exactly one startup mount source may be set.
plugins:
  existingConfigMap: ""
  # Map ConfigMap keys into first-level package directories, for example:
  # [{key: plugin-json, path: quota-policy/plugin.json}]
  configMapItems: []
  existingClaim: ""
  mountPath: /var/lib/mwc/plugins

public:
  sshHost: ""
  apiDomain: ""
  webShellDomain: ""
  webShellOrigin: ""
  # DNS suffix for p-<mapping-id>.<suffix>. It requires wildcard DNS/TLS.
  portMappingDomain: ""

higress:
  namespace: higress-system
  gatewayName: higress-gateway
  podLabels:
    app.kubernetes.io/name: higress-gateway
  # Required when gateway Pods use hostNetwork and the CNI sees node source addresses.
  sourceCidrs: []
  ttydMtls:
    # Existing Higress client-certificate Secret and its required `-cacert` companion.
    # The client private key remains in Higress and is never mounted into a workspace.
    clientSecretNamespace: ""
    clientSecretName: ""
  httpSectionName: http
  httpsSectionName: https
  sshListenerPort: 22
  extAuthPluginUrl: ""

jumpHost:
  enabled: true
  replicas: 2
  image:
    repository: memeloop-workspace-control-ssh-jump
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  hostKeySecretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
jumpHostResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  customMetrics:
    enabled: false
    requestsMetricName: mwc_http_requests_per_second
    targetRequestsPerSecond: "20"
    backlogMetricName: mwc_jobs_pending
    targetBacklogPerPod: "5"

networkPolicy:
  enabled: true

monitoring:
  # Optional Prometheus base URL used for PVC usage/capacity/available telemetry.
  # The control plane performs fixed instant queries; no user-provided PromQL is accepted.
  prometheusUrl: ""
  serviceMonitor:
    enabled: false
    interval: 30s
    # Namespace whose Prometheus Pods may scrape the internal Service on port 8081.
    namespace: monitoring
    labels: {}
  diagnostics:
    # Enables authenticated pprof endpoints on the existing internal listener only.
    enabled: false
    tempSizeLimit: 32Mi
  prometheusRule:
    enabled: false
    labels: {}
    warningFor: 15m
    criticalFor: 5m
