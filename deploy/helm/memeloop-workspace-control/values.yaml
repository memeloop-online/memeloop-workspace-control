installationId: ""
mode: sqlite

image:
  repository: memeloop-workspace-control
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2
serviceAccount:
  create: true

database:
  postgresSecretName: ""
  postgresSecretKey: database-url

secrets:
  encryptionSecretName: ""
  encryptionSecretKey: encryption-key
  internalAuthSecretName: ""
  internalAuthSecretKey: internal-auth-token

sqlite:
  storageClassName: ""
  size: 10Gi

workspace:
  storageClassName: ""
  ttydImage: ""
  # Stable Tailnet node DNS name or IP. Enables per-workspace, auto-assigned SSH NodePorts.
  internalSshHost: ""

public:
  sshHost: ""
  apiDomain: ""
  webShellDomain: ""
  webShellOrigin: ""

higress:
  namespace: higress-system
  gatewayName: higress-gateway
  podLabels:
    app.kubernetes.io/name: higress-gateway
  # Required when gateway Pods use hostNetwork and the CNI sees node source addresses.
  sourceCidrs: []
  httpSectionName: http
  httpsSectionName: https
  sshListenerPort: 22
  extAuthPluginUrl: ""

jumpHost:
  enabled: true
  replicas: 2
  image:
    repository: memeloop-workspace-control-ssh-jump
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  hostKeySecretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
jumpHostResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  customMetrics:
    enabled: false
    requestsMetricName: mwc_http_requests_per_second
    targetRequestsPerSecond: "20"
    backlogMetricName: mwc_jobs_pending
    targetBacklogPerPod: "5"

networkPolicy:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
