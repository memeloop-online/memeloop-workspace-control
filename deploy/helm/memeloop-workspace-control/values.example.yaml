installationId: public-a
mode: postgresql
replicaCount: 3

image:
  repository: ghcr.io/memeloop-online/memeloop-workspace-control
  tag: latest

database:
  postgresSecretName: mwc-public-a-database

secrets:
  encryptionSecretName: mwc-public-a-encryption
  internalAuthSecretName: mwc-public-a-internal-auth

workspace:
  storageClassName: managed-delete
  ttydImage: tsl0922/ttyd:1.7.7

public:
  sshHost: ssh.example.com
  apiDomain: workspaces.example.com
  webShellDomain: shell.example.com
  webShellOrigin: https://shell.example.com

higress:
  extAuthPluginUrl: oci://REPLACE_WITH_PINNED_OFFICIAL_EXT_AUTH_PLUGIN

jumpHost:
  image:
    repository: ghcr.io/memeloop-online/memeloop-workspace-control-ssh-jump
    tag: latest
  hostKeySecretName: mwc-public-a-jump-host-key

autoscaling:
  customMetrics:
    enabled: true
