apiVersion: v1
kind: Service
metadata:
  name: {{ include "mwc.name" . }}
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mwc.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: 8080
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mwc.name" . }}-internal
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mwc.selectorLabels" . | nindent 4 }}
  ports:
    - name: auth
      port: 8081
      targetPort: internal-auth
