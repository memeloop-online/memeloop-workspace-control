apiVersion: v1
kind: Service
metadata:
  name: {{ include "mwc.name" . }}
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mwc.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: 8080
      targetPort: api
    {{- if .Values.public.webShellDomain }}
    # Higress only creates outbound clusters for ports on Services referenced by an Ingress.
    # Keep the auth listener off the public Ingress while making its 8081 cluster discoverable
    # to the fail-closed ext-auth Wasm plugin.
    - name: web-shell-auth
      port: 8081
      targetPort: internal-auth
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mwc.name" . }}-internal
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mwc.selectorLabels" . | nindent 4 }}
  ports:
    - name: auth
      port: 8081
      targetPort: internal-auth
