{{- if .Values.jumpHost.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mwc.name" . }}-ssh-jump
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.jumpHost.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mwc-ssh-jump
      app.kubernetes.io/instance: {{ include "mwc.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mwc-ssh-jump
        app.kubernetes.io/instance: {{ include "mwc.name" . }}
        workspace.memeloop.dev/owner-installation: {{ .Values.installationId | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 19000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openssh
          image: "{{ .Values.jumpHost.image.repository }}:{{ .Values.jumpHost.image.tag }}"
          imagePullPolicy: {{ .Values.jumpHost.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
          ports:
            - name: ssh
              containerPort: 2222
          env:
            - name: MWC_CONTROL_PLANE_URL
              value: http://{{ include "mwc.name" . }}-internal.{{ .Release.Namespace }}.svc.cluster.local:8081
            - name: MWC_INTERNAL_AUTH_TOKEN_FILE
              value: /var/run/mwc-auth/token
          volumeMounts:
            - name: internal-auth
              mountPath: /var/run/mwc-auth
              readOnly: true
            - name: host-key
              mountPath: /etc/ssh/host-keys
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: ssh
          livenessProbe:
            tcpSocket:
              port: ssh
          resources:
            {{- toYaml .Values.jumpHostResources | nindent 12 }}
      volumes:
        - name: internal-auth
          secret:
            secretName: {{ .Values.secrets.internalAuthSecretName }}
            items:
              - key: {{ .Values.secrets.internalAuthSecretKey }}
                path: token
                mode: 0440
        - name: host-key
          secret:
            secretName: {{ .Values.jumpHost.hostKeySecretName }}
            items:
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
                mode: 0400
              - key: ssh_host_ed25519_key.pub
                path: ssh_host_ed25519_key.pub
                mode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mwc.name" . }}-ssh-jump
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mwc-ssh-jump
    app.kubernetes.io/instance: {{ include "mwc.name" . }}
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
{{- end }}
