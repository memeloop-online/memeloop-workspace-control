{{- if eq .Values.mode "sqlite" }}
apiVersion: apps/v1
kind: StatefulSet
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "mwc.name" . }}
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.mode "sqlite" }}
  serviceName: {{ include "mwc.name" . }}
  replicas: 1
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mwc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mwc.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mwc.name" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: {{ include "mwc.controlPlaneImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--installation-id", {{ .Values.installationId | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: api
              containerPort: 8080
            - name: internal-auth
              containerPort: 8081
          env:
            - name: MWC_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MWC_REPLICA_COUNT
              value: {{ ternary "1" (.Values.replicaCount | toString) (eq .Values.mode "sqlite") | quote }}
            - name: MWC_KUBERNETES_ENABLED
              value: "true"
            - name: MWC_INTERNAL_LISTEN_ADDRESS
              value: "0.0.0.0:8081"
            {{- if .Values.monitoring.diagnostics.enabled }}
            - name: MWC_DIAGNOSTICS_ENABLED
              value: "true"
            - name: TMPDIR
              value: /var/run/mwc-diagnostics
            {{- end }}
            - name: MWC_TTYD_IMAGE
              value: {{ .Values.workspace.ttydImage | quote }}
            {{- if .Values.workspace.internalSshHost }}
            - name: MWC_INTERNAL_SSH_HOST
              value: {{ .Values.workspace.internalSshHost | quote }}
            {{- end }}
            {{- if .Values.monitoring.prometheusUrl }}
            - name: MWC_PROMETHEUS_URL
              value: {{ .Values.monitoring.prometheusUrl | quote }}
            {{- end }}
            {{- if or .Values.plugins.existingConfigMap .Values.plugins.existingClaim }}
            - name: MWC_PLUGIN_DIR
              value: {{ .Values.plugins.mountPath | quote }}
            {{- end }}
            - name: MWC_HIGRESS_NAMESPACE
              value: {{ .Values.higress.namespace | quote }}
            - name: MWC_HIGRESS_GATEWAY_NAME
              value: {{ .Values.higress.gatewayName | quote }}
            - name: MWC_HIGRESS_POD_LABELS_JSON
              value: {{ .Values.higress.podLabels | toJson | quote }}
            - name: MWC_HIGRESS_SOURCE_CIDRS_JSON
              value: {{ .Values.higress.sourceCidrs | toJson | quote }}
            - name: MWC_HIGRESS_HTTPS_SECTION_NAME
              value: {{ .Values.higress.httpsSectionName | quote }}
            - name: MWC_JUMP_HOST_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- if .Values.public.webShellDomain }}
            - name: MWC_WEB_SHELL_DOMAIN
              value: {{ .Values.public.webShellDomain | quote }}
            - name: MWC_WEB_SHELL_AUTH_CONFIGURED
              value: "true"
            {{- end }}
            {{- if .Values.public.sshHost }}
            - name: MWC_SSH_PUBLIC_HOST
              value: {{ .Values.public.sshHost | quote }}
            {{- end }}
            {{- if .Values.public.webShellOrigin }}
            - name: MWC_WEB_SHELL_PUBLIC_ORIGIN
              value: {{ .Values.public.webShellOrigin | quote }}
            {{- end }}
            {{- if .Values.public.portMappingDomain }}
            - name: MWC_PORT_MAPPING_PUBLIC_DOMAIN
              value: {{ .Values.public.portMappingDomain | quote }}
            {{- end }}
            {{- if .Values.workspace.storageClassName }}
            - name: MWC_STORAGE_CLASS_NAME
              value: {{ .Values.workspace.storageClassName | quote }}
            {{- end }}
            - name: MWC_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.encryptionSecretName }}
                  key: {{ .Values.secrets.encryptionSecretKey }}
            - name: MWC_INTERNAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.internalAuthSecretName }}
                  key: {{ .Values.secrets.internalAuthSecretKey }}
            {{- if .Values.jumpHost.enabled }}
            - name: MWC_SSH_JUMP_HOST_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jumpHost.hostKeySecretName }}
                  key: ssh_host_ed25519_key.pub
            {{- end }}
            - name: MWC_DATABASE_URL
              {{- if eq .Values.mode "sqlite" }}
              value: "sqlite:///var/lib/mwc/control-plane.sqlite?mode=rwc"
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.postgresSecretName }}
                  key: {{ .Values.database.postgresSecretKey }}
              {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
          livenessProbe:
            httpGet:
              path: /livez
              port: api
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (eq .Values.mode "sqlite") .Values.plugins.existingConfigMap .Values.plugins.existingClaim .Values.monitoring.diagnostics.enabled }}
          volumeMounts:
            {{- if eq .Values.mode "sqlite" }}
            - name: data
              mountPath: /var/lib/mwc
            {{- end }}
            {{- if or .Values.plugins.existingConfigMap .Values.plugins.existingClaim }}
            - name: plugins
              mountPath: {{ .Values.plugins.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.monitoring.diagnostics.enabled }}
            - name: diagnostics-tmp
              mountPath: /var/run/mwc-diagnostics
            {{- end }}
          {{- end }}
      {{- if or .Values.plugins.existingConfigMap .Values.plugins.existingClaim .Values.monitoring.diagnostics.enabled }}
      volumes:
        {{- if or .Values.plugins.existingConfigMap .Values.plugins.existingClaim }}
        - name: plugins
          {{- if .Values.plugins.existingConfigMap }}
          configMap:
            name: {{ .Values.plugins.existingConfigMap | quote }}
            items:
              {{- toYaml .Values.plugins.configMapItems | nindent 14 }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.plugins.existingClaim | quote }}
          {{- end }}
        {{- end }}
        {{- if .Values.monitoring.diagnostics.enabled }}
        - name: diagnostics-tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.monitoring.diagnostics.tempSizeLimit }}
        {{- end }}
      {{- end }}
  {{- if eq .Values.mode "sqlite" }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mwc.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.sqlite.storageClassName }}
        storageClassName: {{ .Values.sqlite.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.sqlite.size }}
  {{- end }}
