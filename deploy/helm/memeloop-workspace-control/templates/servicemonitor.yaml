{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mwc.name" . }}
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mwc.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: auth
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}
      scheme: http
{{- end }}
