{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mwc.name" . }}-ingress
  labels:
    {{- include "mwc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mwc.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.higress.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: higress-gateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mwc-ssh-jump
              app.kubernetes.io/instance: {{ include "mwc.name" . }}
      ports:
        - protocol: TCP
          port: 8081
{{- end }}
